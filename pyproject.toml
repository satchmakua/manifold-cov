[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manifold-cov"
version = "0.0.1"
description = "Functional coverage and constrained-random verification for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Satchel Hamilton" }]
keywords = ["agents", "testing", "verification", "functional-coverage", "llm", "fuzzing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.10",
  "typer>=0.15",
  "rich>=13.9",
]

[project.optional-dependencies]
# Pulled in only when the feature is used; keeps the core install light.
# (The HTML report uses stdlib templating — no extra dependency.)
claude = ["anthropic>=0.40"]  # M3: the real Claude-backed example agent
sdk = ["claude-agent-sdk>=0.2"]  # H3: verify an off-the-shelf claude-agent-sdk agent
wild = [  # W3: the wild-framework hunt (three third-party agent adapters)
  "langgraph>=1.2",
  "langchain-anthropic>=1.4",
  "smolagents[litellm]>=1.26",
  "fastapi>=0.115",  # litellm 1.92 imports it undeclared; without it smolagents crashes
  "pydantic-ai-slim[anthropic]>=2.9",
]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
manifold = "manifold.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/manifold"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
strict = true
